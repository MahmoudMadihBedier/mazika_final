name: mazika
description: "Mazj — Context-aware AI music assistant powered by Spotify"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Spotify Integration
  flutter_web_auth_2: ^4.0.0
  http: ^1.2.2

  # Sensors & Location
  sensors_plus: ^4.0.2
  geolocator: ^13.0.4

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Audio
  just_audio: ^0.9.42
  audio_service: ^0.18.15

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  rxdart: ^0.28.0
  logger: ^2.5.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/
